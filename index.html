<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estatísticas · Alpha Treinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sf:rgba(9,15,46,.82);--tx:#eef2ff;--mu:#aeb9e6;--ac:#ffb020;--acx:#1a1300;--ln:rgba(150,172,255,.28);--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{background:#000}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.4 Barlow,system-ui,sans-serif;background:linear-gradient(#1d4ed8,#0a1240 42%,#000) no-repeat;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:560px;margin:0 auto}
header .t{font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.2em}
.ib{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.ib:focus-visible{outline:2px solid var(--ac)}
.pill{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px}
main{max-width:560px;margin:0 auto;padding:0 16px 48px}
h1{font:700 36px/1.05 'Barlow Condensed',sans-serif;margin:10px 0 2px}
h2{font:700 24px 'Barlow Condensed',sans-serif;margin:30px 0 10px}
.mu{color:var(--mu)}.sm{font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;margin-top:14px;border-color:var(--ac)}
.search input{all:unset;flex:1;padding:15px 0;font-size:17px;color:var(--tx)}
.search svg{flex:none;color:var(--mu)}
#sug{margin-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.row+.row{border-top:1px solid var(--ln)}
.row b,.nm{font-weight:600}
.row small{display:block;color:var(--mu);font-size:13px}
.bar{margin-top:10px;overflow:hidden}
.bar>button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;cursor:pointer;font:700 21px 'Barlow Condensed',sans-serif}
.bar>button:focus-visible{outline:2px solid var(--ac);outline-offset:-3px}
.bar>button svg{transition:transform .2s}
.bar>button[aria-expanded=true] svg{transform:rotate(180deg)}
.bd{padding:0 14px 16px}
.bd[hidden]{display:none}
.md{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;font-size:14px;background:#2a356b;flex:none}
.md.m1{background:var(--ac);color:var(--acx)}.md.m2{background:#d7dcf0;color:#12173a}.md.m3{background:#cd7f32;color:#1a0d00}
.tm{padding:12px;border:1px solid var(--ln);border-radius:12px;margin-top:10px}
.tm .h{display:flex;align-items:center;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.g4 div{background:rgba(3,7,30,.6);border:1px solid var(--ln);border-radius:10px;text-align:center;padding:8px 2px}
.g4 b{display:block;color:var(--ac);font:700 22px/1.1 'Barlow Condensed',sans-serif}
.g4 span{font-size:11px;color:var(--mu)}
.pl{display:flex;align-items:center;gap:10px;padding:10px 0}
.pl+.pl{border-top:1px solid var(--ln)}
.pl .nm{flex:1;min-width:0}.pl small{display:block;color:var(--mu);font-size:13px;font-weight:400}
.v{color:var(--ac);font:700 24px 'Barlow Condensed',sans-serif}
.rec{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.rec+.rec{border-top:1px solid var(--ln)}
.rec small{display:block;color:var(--mu);font-size:13px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gr a{padding:16px 8px;text-align:center;font-weight:600}
.xt{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;margin-top:8px}
.xt small{display:block;color:var(--mu);font-size:13px}
.xt .d{color:var(--ac);font:700 20px 'Barlow Condensed',sans-serif}
.nt{color:var(--mu);font-size:13px;margin:0 0 6px}
#mn{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6)}
#mn[hidden]{display:none}
#mn nav{width:78%;max-width:300px;height:100%;background:#0a1240;border-right:1px solid var(--ln);padding:calc(env(safe-area-inset-top,0px) + 18px) 0}
#mn a{display:block;padding:15px 22px;font-size:18px;font-weight:600}
.mp{padding:14px;margin-top:12px}.mh{display:flex;justify-content:space-between;align-items:baseline}
.mh b{font:700 22px 'Barlow Condensed',sans-serif;color:var(--ac)}
.cl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 div{background:rgba(3,7,30,.6);border:1px solid var(--ln);border-radius:12px;text-align:center;padding:12px 6px}
.g2 b{display:block;color:var(--ac);font:700 30px/1.1 'Barlow Condensed',sans-serif}
.g2 span{font-size:12px;color:var(--mu)}
.pl .pill{flex:none}
@media (prefers-reduced-motion:reduce){.bar>button svg{transition:none}}
</style>
</head>
<body>
<header>
  <button class="ib" id="bm" aria-label="Abrir menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span class="t">ESTATÍSTICAS</span>
  <a class="pill" href="https://alpha-treinos.github.io/XTreinos-alpha/">Alpha Treinos ›</a>
</header>
<div id="mn" hidden><nav>
  <a href="#/">Início</a><a href="#/rankings/kills">Rankings</a><a href="#/xtreinos">X-treinos</a>
  <a href="https://alpha-treinos.github.io/XTreinos-alpha/">Voltar ao Alpha Treinos</a>
</nav></div>
<main id="app"><p class="mu">Carregando…</p></main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ---------- Firebase (mesma configuração pública do site principal; só leitura) ---------- */
const app=initializeApp({apiKey:"AIzaSyCccgmFQCDeEIvm_UcC08_PCJQMl7gjmHc",authDomain:"x-treinos-alpha.firebaseapp.com",projectId:"x-treinos-alpha",storageBucket:"x-treinos-alpha.firebasestorage.app",messagingSenderId:"494624379702",appId:"1:494624379702:web:d7b3e02e562149dba89997"});
const db=getFirestore(app);

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const TZ='America/Sao_Paulo';
const dm=ms=>new Date(ms).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:TZ});
const dk=s=>s.slice(8,10)+'/'+s.slice(5,7);               // '2026-10-26' vira '26/10'
const hoje=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CHEV='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const SEG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const LUPA='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
const md=i=>`<span class="md${i<3?' m'+(i+1):''}">${i+1}</span>`;

/* ---------- dados (3 leituras: home, times, xtreinos) ---------- */
let D=null;const aberto=new Set(['semana']);
const get=async id=>{const s=await getDoc(doc(db,'stats',id));return s.exists()?s.data():null};
async function carregar(){
  try{
    const [home,times,xt]=await Promise.all([get('home'),get('times'),get('xtreinos')]);
    D={home,times:(times&&times.list)||[],xt:((xt&&xt.list)||[]).slice().sort((a,b)=>b.date-a.date)};
  }catch(e){console.error(e);D={erro:true}}
  render();
}

/* ---------- as 4 barras que expandem ---------- */
function barraSemana(h){
  const w=h.week||{},ts=w.teams||[];
  let s=`<p class="nt">Semana de ${dk(w.from)} a ${dk(w.to)}</p>`;
  if(hoje()>w.to)s+='<p class="nt">Aguardando a próxima atualização dos ADMs.</p>';
  s+=ts.length?ts.map((t,i)=>`<div class="tm"><div class="h">${md(i)}<span class="nm">${esc(t.name)}</span></div>
    <div class="g4"><div><b>${t.pts}</b><span>pontos</span></div><div><b>${t.kills}</b><span>abates</span></div><div><b>${t.booyahs}</b><span>booyahs</span></div><div><b>${t.x}</b><span>x-treinos</span></div></div></div>`).join(''):'<p class="mu">Nenhum x-treino nesta semana ainda.</p>';
  if(w.player)s+=`<p class="nt" style="margin-top:14px">Mais abates da semana</p><div class="pl"><span class="nm">${esc(w.player.nick)}<small>${esc(w.player.team)}</small></span><span class="v">${w.player.v}</span></div>`;
  return s;
}
function barraMes(h){
  const m=h.month||{},ps=m.players||[],[a,b]=String(m.key||'').split('-');
  return `<p class="nt">${MESES[(+b||1)-1]} de ${a}</p>`+(ps.length?ps.map((p,i)=>`<div class="pl">${md(i)}<span class="nm">${esc(p.nick)}<small>${esc(p.team)}</small></span><span class="v">${p.v}</span></div>`).join(''):'<p class="mu">Nenhum abate lançado neste mês ainda.</p>');
}
function barraRecordes(h){
  const r=h.records||{},L=[];
  if(r.queda)L.push(['Mais abates em 1 queda',r.queda.v,`${r.queda.nick} · ${r.queda.team} · ${dm(r.queda.date)}`]);
  if(r.dayPlayer)L.push(['Mais abates em 1 dia',r.dayPlayer.v,`${r.dayPlayer.nick} · ${r.dayPlayer.team} · ${dk(r.dayPlayer.day)}`]);
  if(r.dayTeam)L.push(['Mais abates de um time em 1 dia',r.dayTeam.v,`${r.dayTeam.name} · ${dk(r.dayTeam.day)}`]);
  if(r.teamPoints)L.push(['Maior pontuação de um time em 1 x-treino',r.teamPoints.v,`${r.teamPoints.name} · ${r.teamPoints.event} · ${dm(r.teamPoints.date)}`]);
  if(r.teamBooyahs)L.push(['Mais booyahs de um time em 1 x-treino',r.teamBooyahs.v,`${r.teamBooyahs.name} · ${r.teamBooyahs.event} · ${dm(r.teamBooyahs.date)}`]);
  return L.length?L.map(x=>`<div class="rec"><span>${esc(x[0])}<small>${esc(x[2])}</small></span><span class="v">${x[1]}</span></div>`).join(''):'<p class="mu">Ainda não há recordes.</p>';
}
function barraUltimo(h){
  const l=h.last;if(!l)return '<p class="mu">Ainda não há x-treinos.</p>';
  return `<p class="nt">${esc(l.name)} · ${dm(l.date)}</p>`+(l.teams||[]).map((t,i)=>`<div class="pl">${md(i)}<span class="nm">${esc(t.name)}<small>${t.kills} abates · ${t.booyahs} booyah${t.booyahs===1?'':'s'}</small></span><span class="v">${t.pts}</span></div>`).join('');
}
const barra=(id,titulo,corpo)=>`<section class="card bar"><button data-bar="${id}" aria-expanded="${aberto.has(id)}">${titulo}${CHEV}</button><div class="bd" ${aberto.has(id)?'':'hidden'}>${corpo}</div></section>`;

/* ---------- páginas ---------- */
function inicio(){
  if(!D)return '<p class="mu">Carregando…</p>';
  if(D.erro)return '<h1>Estatísticas</h1><p class="mu">Não foi possível carregar os dados. Verifique a internet e atualize a página.</p>';
  let s=`<h1>Estatísticas</h1><p class="mu" style="margin:0">Pesquise um time do Alpha Treinos</p>
  <div class="card search">${LUPA}<input id="q" type="search" placeholder="Nome do time" autocomplete="off" aria-label="Pesquisar time"></div><div id="sug"></div>`;
  if(D.home){
    s+=barra('semana','Melhor time da semana',barraSemana(D.home))+barra('mes','Melhores jogadores do mês',barraMes(D.home))+barra('recordes','Recordes',barraRecordes(D.home))+barra('ultimo','Último x-treino',barraUltimo(D.home));
  }else s+='<p class="mu" style="margin-top:20px">As estatísticas ainda não foram calculadas. Os ADMs precisam tocar em “Atualizar estatísticas” no painel do Alpha Treinos.</p>';
  s+='<h2>Rankings</h2><div class="gr">'+[['kills','Abates totais'],['queda','Recorde por queda'],['xtreino','Melhor x-treino'],['xtreinos','Mais x-treinos']].map(r=>`<a class="card" href="#/rankings/${r[0]}">${r[1]}</a>`).join('')+'</div>';
  s+='<h2>Últimos x-treinos</h2>'+(D.xt.length?D.xt.slice(0,3).map(x=>`<a class="card xt" href="#/xtreino/${encodeURIComponent(x.id)}"><span class="nm">${esc(x.name)}<small>Campeão: ${esc(x.champion||'—')}</small></span><span class="d">${dm(x.date)}</span></a>`).join('')+'<p style="text-align:right"><a class="mu sm" href="#/xtreinos">Ver todos ›</a></p>':'<p class="mu">Ainda não há x-treinos.</p>');
  return s;
}
/* ---------- página do time (lê o documento t_<chave>) ---------- */
const TM={},pend=new Set();   // cache dos times
async function carregarTime(k){
  if(k in TM||pend.has(k))return;pend.add(k);
  try{TM[k]=(await get('t_'+k))||false}catch(e){console.error(e);TM[k]='erro'}
  pend.delete(k);render();
}
const caixa=(n,l)=>`<div><b>${n}</b><span>${l}</span></div>`;
const voltar=m=>`<p><a class="pill" href="#/">‹ Início</a></p><p class="mu">${m}</p>`;
function paginaTime(d,k){
  if(d==='erro')return voltar('Não foi possível carregar o time. Verifique a internet e tente de novo.');
  if(!d)return voltar('Time não encontrado. Ele pode ainda não ter jogado nenhum x-treino.');
  const ps=d.players||[];
  return `<p><a class="pill" href="#/">‹ Início</a></p><h1>${esc(d.name)}</h1><p class="mu" style="margin:0">${d.xtreinos} x-treino${d.xtreinos===1?'':'s'}${d.since?' · desde '+dm(d.since):''}</p>
  <h2>Melhores jogadores</h2>`+(ps.length?'<div class="card" style="padding:0 14px">'+ps.map((p,i)=>`<div class="pl">${md(i)}<span class="nm">${esc(p.nick)}<small>${p.kills} abates no time</small></span><a class="pill" href="#/jogador/${encodeURIComponent(p.key)}">ver perfil</a></div>`).join('')+'</div>':'<p class="mu">Ainda sem abates lançados.</p>')+
  `<h2>Estatísticas do time</h2><div class="g2">${caixa(d.xtreinos,'x-treinos jogados')}${caixa(d.booyahs,'booyahs')}${caixa(d.bestEvent,'mais abates em 1 x-treino')}${caixa(d.bestDay,'mais abates em 1 dia')}</div>
  <a class="card row" style="margin-top:16px" href="#/time/${encodeURIComponent(k)}/mapas"><b>Desempenho por mapa</b>${SEG}</a>`;
}
function paginaMapas(d,k){
  if(!d||d==='erro')return paginaTime(d,k);
  const v=n=>String(n).replace('.',',');
  return `<p><a class="pill" href="#/time/${encodeURIComponent(k)}">‹ ${esc(d.name)}</a></p><h1>Desempenho por mapa</h1>`+(d.maps||[]).map((m,i)=>`<section class="card mp"><div class="mh"><b>${esc(m.map)}</b><span class="mu sm">queda ${i+1}</span></div>`+(m.count?`<p class="nt" style="margin-top:6px">Últimos ${m.count} x-treinos (colocação, o mais recente à esquerda)</p><div class="cl">${m.placements.map(p=>`<span class="md${p<=3?' m'+p:''}">${p}</span>`).join('')}</div><div class="g2">${caixa(v(m.avgPoints),'média de pontos')}${caixa(v(m.avgKills),'média de abates')}</div>`:'<p class="mu">Este time ainda não jogou esta queda.</p>')+'</section>').join('');
}
function emBreve(){
  const p=location.hash.replace(/^#\/?/,'').split('/')[0],T={time:'Página do time',rankings:'Rankings',xtreinos:'X-treinos',xtreino:'Resultado do x-treino',jogador:'Perfil do jogador'};
  return `<h1>${T[p]||'Página não encontrada'}</h1><p class="mu">Esta página chega nas próximas etapas.</p><p><a class="pill" href="#/">‹ Voltar ao início</a></p>`;
}
function render(){
  const h=location.hash.replace(/^#\/?/,'');
  const p=h.split('/');
  if(p[0]==='time'&&p[1]){
    const k=decodeURIComponent(p[1]);
    if(!(k in TM)){carregarTime(k);$('#app').innerHTML='<p class="mu">Carregando…</p>';return}
    $('#app').innerHTML=p[2]==='mapas'?paginaMapas(TM[k],k):paginaTime(TM[k],k);return;
  }
  $('#app').innerHTML=h?emBreve():inicio();
  if(!h)ligarBusca();
}

/* ---------- busca de times (aparece conforme digita) ---------- */
function ligarBusca(){
  const q=$('#q');if(!q)return;
  q.addEventListener('input',()=>{
    const t=norm(q.value),box=$('#sug');
    if(!t){box.innerHTML='';return}
    const ok=D.times.filter(x=>norm(x.name).includes(t)).sort((a,b)=>(norm(b.name).startsWith(t))-(norm(a.name).startsWith(t))||a.name.localeCompare(b.name)).slice(0,6);
    box.innerHTML=ok.length?'<div class="card">'+ok.map(x=>`<a class="row" href="#/time/${encodeURIComponent(x.key)}"><span><b>${esc(x.name)}</b><small>${x.x} x-treino${x.x===1?'':'s'}</small></span>${SEG}</a>`).join('')+'</div>':'<p class="mu sm">Nenhum time encontrado.</p>';
  });
}

/* ---------- eventos ---------- */
$('#app').addEventListener('click',e=>{
  const b=e.target.closest('[data-bar]');if(!b)return;
  const id=b.dataset.bar,ab=b.getAttribute('aria-expanded')!=='true';
  ab?aberto.add(id):aberto.delete(id);
  b.setAttribute('aria-expanded',ab);b.nextElementSibling.hidden=!ab;
});
const menu=v=>{$('#mn').hidden=!v};
$('#bm').onclick=()=>menu(true);
$('#mn').onclick=e=>{if(e.target.id==='mn'||e.target.closest('a'))menu(false)};
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});

render();carregar();
</script>
</body>
</html>
